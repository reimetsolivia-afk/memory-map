<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Memory Map</title>

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <link rel="stylesheet" href="style.css">

</head>


    <body>
    
        <div id="login">
            <h2>Memory Map</h2>
    
            <p>Enter your invitation code to continue.</p>
    
            <input
                type="text"
                id="invite-code"
                placeholder="Invitation code"
            >
    
            <button id="enter-map">
                Enter
            </button>
    
            <p id="login-message"></p>
        </div>
    
    
        <div id="site">
    
            <header>
                <h1>Memory Map</h1>
                <p>Places that mean something to us.</p>
            </header>
    
            <main>
                <p>Click anywhere on the map to add a memory.</p>
                <div id="map"></div>
            </main>
    
        </div>
    
    
        <iframe
            name="hiddenFrame"
            style="display: none;">
        </iframe>
    
    
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
        <script src="script.js"></script>
    
    </body>

</html>
