<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Memory Map</title>

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <link rel="stylesheet" href="style.css">

</head>


  <body>
    <header>
        <h1>Memory Map</h1>
        <p>
            Places that mean something to us.
        </p>
    </header>

    <main>
        <p>
            Click anywhere on the map to add a memory.
        </p>
        <div id="map"></div>
    </main>

    <!-- Hidden iframe used when sending data to Google Apps Script -->
    <iframe
        name="hiddenFrame"
        style="display: none;"
    ></iframe>

    <!-- Leaflet JavaScript -->
    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    ></script>

    <!-- Our own JavaScript -->
    <script src="script.js"></script>

</body>
</html>
